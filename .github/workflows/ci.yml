on: [push]

name: ci

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@master
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: -v
  build:
    if: contains(github.ref, 'tags/v')
    needs: test
    strategy:
      matrix:
        os:
          - name: macos-latest
            target: x86_64-apple-darwin
            use-cross: false
          - name: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
          - name: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - name: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-cross: true
    runs-on: ${{ matrix.os.name }}
    steps:
      - uses: actions/checkout@master
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os.target }}

      - name: Run Build
        run: |
          if [ "${{ matrix.os.use-cross }}" = "true" ]; then
            cargo install cross --git https://github.com
            cross build --release --target ${{ matrix.os.target }}
          else
            cargo build --release --target ${{ matrix.os.target }}
          fi

      - name: Archive asset
        id: dist
        run: ./ci/tar.sh ${{ github.ref }} ${{ matrix.os.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.name }}
          path: ${{ steps.dist.outputs.name }}

  release:
    if: contains(github.ref, 'tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          repository: maralla/homebrew-pack
          token: ${{ secrets.ACTIONS_PAT }}
      - id: version
        run: |
          echo ::set-output name=version::${TAG##refs/tags/}
        env:
          TAG: ${{ github.ref }}
      - uses: actions/download-artifact@v1
        with:
          name: macos-latest
      - uses: actions/download-artifact@v1
        with:
          name: ubuntu-latest
      - uses: actions/create-release@v1
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
      - name: Upload macos-x86 asset
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: ./macos-latest/pack-${{ steps.version.outputs.version }}-x86_64-apple-darwin.tar.gz
          asset_name: pack-${{ steps.version.outputs.version }}-x86_64-apple-darwin.tar.gz
          asset_content_type: application/gzip
      - name: Upload macos-aarch64 asset
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: ./macos-latest/pack-${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz
          asset_name: pack-${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz
          asset_content_type: application/gzip
      - name: Upload linux-x86 asset
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: ./ubuntu-latest/pack-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
          asset_name: pack-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
          asset_content_type: application/gzip
      - name: Upload linux-aarch64 asset
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: ./ubuntu-latest/pack-${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
          asset_name: pack-${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
          asset_content_type: application/gzip
      - name: Update brew formula
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: ./update.sh ${{ steps.version.outputs.version }}
