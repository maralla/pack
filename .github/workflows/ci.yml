on: [push]

name: ci

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -v

  build:
    if: contains(github.ref, 'tags/v') || github.ref_name == 'debug-ci'
    needs: test
    strategy:
      matrix:
        os:
          - name: macos-latest
            target: x86_64-apple-darwin
            use-cross: false
          - name: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
          - name: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - name: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-cross: true
    runs-on: ${{ matrix.os.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os.target }}

      - name: Run Build
        run: |
          if [ "${{ matrix.os.use-cross }}" = "true" ]; then
            cargo install cross
            cross build --release --target ${{ matrix.os.target }}
          else
            cargo build --release --target ${{ matrix.os.target }}
          fi

      - name: Archive asset
        id: dist
        env:
          GITHUB_OUTPUT: ${{ github.output }}
        run: ./ci/tar.sh ${{ github.ref }} ${{ matrix.os.target }}

      # Matrix uploading to distinct targets prevents overlap collisions in v4
      - uses: actions/upload-artifact@v4
        with:
          name: pack-binaries-${{ matrix.os.target }}
          path: ${{ steps.dist.outputs.name }}

  release:
    if: contains(github.ref, 'tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating release tags natively
    steps:
      - uses: actions/checkout@v4
        with:
          repository: maralla/homebrew-pack
          token: ${{ secrets.ACTIONS_PAT }}

      - id: version
        run: |
          echo "version=${TAG##refs/tags/}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ github.ref }}

      # Downloads all matrix archives using v4 wildcards into a unified staging dir
      - uses: actions/download-artifact@v4
        with:
          pattern: pack-binaries-*
          path: ./artifacts
          merge-multiple: true

      # Modern standard replacement for creating releases and attaching assets at once
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/pack-${{ steps.version.outputs.version }}-x86_64-apple-darwin.tar.gz
            ./artifacts/pack-${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz
            ./artifacts/pack-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            ./artifacts/pack-${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update brew formula
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: ./update.sh ${{ steps.version.outputs.version }}
